---
deployment:
  tasks:
    - export DEPLOYPATH=/home/davidcglass/public_html/
    # -rt copies files and timestamps only; it never changes public_html's own permissions or group
    - /bin/rsync -rt --exclude='.git' --exclude='.cpanel.yml' --exclude='README.md' ./ $DEPLOYPATH
    - /bin/find $DEPLOYPATH -maxdepth 1 -type f -exec /bin/chmod 644 {} +
