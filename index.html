<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1a1512;
    color: #fff;
    font-family: "Libre Franklin", Helvetica, Arial, sans-serif;
  }
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
        background: #1a1512;
    overflow: hidden;
  }
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background: url("hero.jpg?v=1") right center / cover no-repeat;
  }
  .hero::before {               /* dark overlay like the original */
    content: "";
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, rgba(10,8,6,.85) 0%, rgba(10,8,6,.55) 45%, rgba(10,8,6,.35) 100%);
  }
  .content {
    position: relative; z-index: 2;
    padding: 0 6vw;
    max-width: 1200px;
  }
  h1 {
    font-family: "Poppins", sans-serif;
    font-weight: 700;
    font-size: clamp(3rem, 6.667vw, 6rem);
    line-height: 1.02;
    letter-spacing: -.03em;
  }
  .roles {
    margin-top: 2.2rem;
    font-weight: 300;
    font-size: clamp(1rem, 1.25vw, 1.125rem);
    line-height: 1.7;
    color: rgba(255,255,255,.82);
    max-width: 34em;
    text-wrap: balance;
  }
  .roles .ln { white-space: nowrap; }
  /* 1440px+ : scale up smoothly to the full size, reached at 1800px */
  @media (min-width: 1440px) {
    h1 { font-size: clamp(6rem, calc(13.333vw - 6rem), 9rem); }
    .roles { font-size: clamp(1.125rem, calc(1.222vw + 0.4px), 1.4rem); }
  }
  .social {
    margin-top: 2.6rem;
    display: flex; gap: 1.6rem;
    list-style: none;
  }
  .social a {
    display: grid; place-items: center;
    width: 38px; height: 38px;
    color: #fff; opacity: .85;
    transition: opacity .2s, transform .2s;
  }
  .social a:hover { opacity: 1; transform: translateY(-2px); }
  .social svg { width: 26px; height: 26px; fill: currentColor; }

  /* Menu */
  .menu-btn {
    position: fixed; top: 22px; right: 26px; z-index: 10;
    width: 40px; height: 30px; background: none; border: 0; cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .menu-btn span { display: block; height: 4px; background: #fff; border-radius: 1px; transition: .3s; }
  .menu-open .menu-btn span:nth-child(1) { transform: translateY(13px) rotate(45deg); }
  .menu-open .menu-btn span:nth-child(2) { opacity: 0; }
  .menu-open .menu-btn span:nth-child(3) { transform: translateY(-13px) rotate(-45deg); }
  nav {
    position: fixed; inset: 0; z-index: 5;
    background: rgba(10,8,6,.96);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  nav { visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  .menu-open nav { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity .3s, visibility 0s; }
  .menu-btn:focus-visible, nav a:focus-visible, .social a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  nav ul { list-style: none; text-align: center; }
  nav a {
    font-family: "Poppins", sans-serif; font-weight: 700;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: #fff; text-decoration: none; line-height: 1.6;
  }
  nav a { text-transform: uppercase; letter-spacing: .04em; }
  nav a:hover { color: #c9b8e8; }

  /* Landscape screens (laptops, monitors, tablets sideways):
     photo kept at its true 16:9 shape, placed so David sits to the right of the text */
  @media (min-width: 701px) and (orientation: landscape) {
    .hero { background: #3e3e40; }
    .bg {
      left: calc(73.5vw - 106.67vh); right: auto;
      width: 177.78vh;
      background-size: 100% 100%;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 25%);
              mask-image: linear-gradient(to right, transparent 0, #000 25%);
    }
    .content { padding-left: 8vw; padding-top: 150px; }
    .roles { max-width: 27em; }
  }
  @media (min-width: 1280px) and (orientation: landscape) {
    .content { padding-left: 200px; }
    .roles { max-width: 34em; }
  }
  /* Phones and portrait tablets: full photo, face at top, text below */
  @media (max-width: 700px), (orientation: portrait) {
    .roles br { display: none; }
    .roles .ln { white-space: normal; }
    html, body { height: 100%; overflow: hidden; }
    .hero { height: 100vh; height: 100dvh; min-height: 0; align-items: center; }
    h1 { font-size: clamp(2.4rem, 12vw, 3.4rem); }
    .roles { margin-top: 1.2rem; font-size: .95rem; line-height: 1.6; }
    .social { margin-top: 1.4rem; gap: 1rem; }
    /* Sized from the element itself (not vh), so mobile browser toolbars can't shift it */
    .bg {
      inset: auto; top: 0; left: 50%;
      height: 100%; width: auto; aspect-ratio: 16 / 9;
      transform: translateX(-59.8%);
      background-size: 100% 100%;
    }
    .content { padding-top: 14vh; }
    .menu-btn { top: 18px; right: 18px; width: 28px; height: 20px; }
    .menu-btn span { height: 3px; }
    .menu-open .menu-btn span:nth-child(1) { transform: translateY(8.5px) rotate(45deg); }
    .menu-open .menu-btn span:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); }
    .hero::before { background: rgba(10,8,6,.6); }
  }
  @media (min-width: 701px) and (orientation: portrait) {
    h1 { font-size: 4.5rem; }
    .roles { font-size: 1.15rem; max-width: 30em; }
    .content { padding-left: 8vw; padding-right: 8vw; }
  }
  /* Phones: start the text below the chin */
  @media (max-width: 700px) {
    .content { padding-top: 30vh; }
  }

<script>
(function () {
  var btn = document.querySelector('.menu-btn');
  var nav = document.getElementById('site-menu');
  function setOpen(open, returnFocus) {
    document.body.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open);
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    if (open) nav.querySelector('a').focus();
    else if (returnFocus) btn.focus();
  }
  btn.addEventListener('click', function () { setOpen(!document.body.classList.contains('menu-open')); });
  nav.addEventListener('click', function () { setOpen(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('menu-open')) setOpen(false, true);
  });
})();
</script>
